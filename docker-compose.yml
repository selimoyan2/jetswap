services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://jetswap:jetswappassword@postgres:5432/jetswap_db?schema=public
      - NEXTAUTH_SECRET=supersecret_jetswap_key_replace_in_production
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: jetswap
      POSTGRES_PASSWORD: jetswappassword
      POSTGRES_DB: jetswap_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
